name: ci-required

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-required-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Merge gate (.lastgit/ci.sh)
        env:
          NO_COLOR: "1"
        run: bash .lastgit/ci.sh

  ci-required:
    name: ci-required
    if: always()
    needs: [test]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every job to succeed
        env:
          RESULT: ${{ needs.test.result }}
        run: |
          echo "test: $RESULT"
          test "$RESULT" = "success"
